<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/app.css">
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</head>
<body class="bg-gray-50 flex flex-col h-screen font-sans antialiased text-gray-900 pb-20 relative">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm flex items-center px-4 py-4">
        <button id="btnBack" class="text-gray-500 hover:text-gray-900 transition-colors p-2 -ml-2 rounded-full">
            <span class="iconify" data-icon="mdi:arrow-left" data-width="24" data-height="24"></span>
        </button>
        <h1 class="text-lg font-bold text-gray-900 ml-2">Global Leaderboard</h1>
    </header>

    <main class="flex-1 overflow-y-auto px-4 py-6" id="leaderboardContainer">

        <div id="loadingState" class="space-y-3">
            <!-- Shimmer Placeholder Cards -->
            <div class="shimmer-item h-16 w-full shimmer-card"></div>
            <div class="shimmer-item h-16 w-full shimmer-card"></div>
            <div class="shimmer-item h-16 w-full shimmer-card"></div>
            <div class="shimmer-item h-16 w-full shimmer-card"></div>
            <div class="shimmer-item h-16 w-full shimmer-card"></div>
        </div>

        <div id="emptyState" class="hidden flex flex-col items-center justify-center mt-20 text-center space-y-4">
            <span class="iconify text-gray-300" data-icon="mdi:podium" data-width="80" data-height="80"></span>
            <h2 class="text-lg font-bold text-gray-700">No Rankings Yet</h2>
            <p class="text-sm text-gray-500">Matches haven't been resolved.</p>
        </div>

        <div id="errorState" class="hidden flex flex-col items-center justify-center mt-20 text-center space-y-4">
            <span class="iconify text-red-300" data-icon="mdi:alert-circle-outline" data-width="80" data-height="80"></span>
            <h2 class="text-lg font-bold text-gray-700">Error Loading Leaderboard</h2>
            <p id="errorText" class="text-sm text-gray-500">Failed to load data.</p>
            <button id="btnRetry" class="mt-4 px-6 py-2 bg-blue-100 text-blue-700 font-bold rounded-full hover:bg-blue-200 transition">Try Again</button>
        </div>

        <div id="rankingsList" class="space-y-3 hidden pb-10">
            <!-- Cards populated via JS -->
        </div>

    </main>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const container = document.getElementById('leaderboardContainer');
            const list = document.getElementById('rankingsList');
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');
            const errorState = document.getElementById('errorState');

            document.getElementById('btnBack').addEventListener('click', () => {
                window.history.back();
            });
            document.getElementById('btnRetry').addEventListener('click', loadLeaderboard);

            async function loadLeaderboard() {
                loadingState.classList.remove('hidden');
                emptyState.classList.add('hidden');
                errorState.classList.add('hidden');
                list.classList.add('hidden');

                try {
                    const response = await Api.get('/Api/Leaderboard/top.php');
                    renderLeaderboard(response.data || []);
                } catch (error) {
                    loadingState.classList.add('hidden');
                    errorState.classList.remove('hidden');
                    document.getElementById('errorText').textContent = error;
                }
            }

            function renderLeaderboard(data) {
                list.innerHTML = '';
                loadingState.classList.add('hidden');

                if (data.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                list.classList.remove('hidden');

                data.forEach((user, index) => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between";

                    // Rank Styling Logic (Phase 7 Polish)
                    let rankHtml = '';
                    if (user.rank === 1) {
                        rankHtml = `<span class="iconify text-yellow-400" data-icon="mdi:crown" data-width="28" data-height="28"></span>`;
                    } else if (user.rank === 2) {
                        rankHtml = `<span class="iconify text-gray-400" data-icon="mdi:medal" data-width="28" data-height="28"></span>`;
                    } else if (user.rank === 3) {
                        rankHtml = `<span class="iconify text-orange-400" data-icon="mdi:medal" data-width="28" data-height="28"></span>`;
                    } else {
                        rankHtml = `<span class="w-7 h-7 flex items-center justify-center font-bold text-gray-400 text-lg">${user.rank}</span>`;
                    }

                    // Rivalry Check Logic (Phase 11)
                    let rivalryBadge = '';
                    const currentBranch = user.branch;
                    const prevBranch = index > 0 ? data[index - 1].branch : currentBranch;
                    const nextBranch = index < data.length - 1 ? data[index + 1].branch : currentBranch;

                    if (currentBranch !== prevBranch || currentBranch !== nextBranch) {
                        rivalryBadge = `<span class="bg-red-100 text-red-600 text-[10px] font-bold px-1.5 py-0.5 rounded ml-2">⚔️ RIVALRY!</span>`;
                    }

                    card.innerHTML = `
                        <div class="flex items-center space-x-4">
                            <div class="flex-shrink-0 flex justify-center w-8">
                                ${rankHtml}
                            </div>
                            <div class="flex flex-col">
                                <div class="flex items-center">
                                    <span class="font-bold text-gray-900 text-[15px] leading-tight">${user.username}</span>
                                </div>
                                <div class="flex items-center mt-0.5">
                                    <span class="text-xs text-gray-500">${user.branch}</span>
                                    ${rivalryBadge}
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1.5 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100">
                            <span class="iconify text-blue-600" data-icon="mdi:coins" data-width="16"></span>
                            <span class="font-extrabold text-blue-600 text-sm">${user.total_coins}</span>
                        </div>
                    `;

                    list.appendChild(card);
                });
            }

            // Init
            loadLeaderboard();
        });
    </script>
</body>
</html>
