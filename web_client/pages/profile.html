<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/app.css">
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</head>
<body class="bg-gray-50 flex flex-col h-screen font-sans antialiased text-gray-900 pb-20 relative">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm flex items-center px-4 py-4 justify-between">
        <div class="flex items-center">
            <button id="btnBack" class="text-gray-500 hover:text-gray-900 transition-colors p-2 -ml-2 rounded-full">
                <span class="iconify" data-icon="mdi:arrow-left" data-width="24" data-height="24"></span>
            </button>
            <h1 class="text-lg font-bold text-gray-900 ml-2">My Profile</h1>
        </div>
        <button id="btnLogout" class="text-red-500 hover:bg-red-50 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center transition-colors">
            <span class="iconify mr-1.5" data-icon="mdi:logout" data-width="18" data-height="18"></span>
            Logout
        </button>
    </header>

    <main class="flex-1 overflow-y-auto px-4 py-6" id="profileContainer">

        <div id="loadingState" class="space-y-4">
            <div class="shimmer-item h-48 w-full shimmer-card rounded-2xl"></div>
            <div class="shimmer-item h-12 w-full shimmer-card mt-6"></div>
            <div class="shimmer-item h-24 w-full shimmer-card"></div>
        </div>

        <div id="errorState" class="hidden flex flex-col items-center justify-center mt-20 text-center space-y-4">
            <span class="iconify text-red-300" data-icon="mdi:alert-circle-outline" data-width="80" data-height="80"></span>
            <h2 class="text-lg font-bold text-gray-700">Error Loading Profile</h2>
            <p id="errorText" class="text-sm text-gray-500">Failed to load data.</p>
            <button id="btnRetry" class="mt-4 px-6 py-2 bg-blue-100 text-blue-700 font-bold rounded-full hover:bg-blue-200 transition">Try Again</button>
        </div>

        <div id="profileContent" class="hidden space-y-6">

            <!-- Profile Card -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 text-center relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-16 bg-blue-50"></div>

                <div class="relative z-10">
                    <div class="w-20 h-20 bg-blue-100 rounded-full mx-auto border-4 border-white flex items-center justify-center shadow-sm">
                        <span class="iconify text-blue-600" data-icon="mdi:account" data-width="40" data-height="40"></span>
                    </div>

                    <h2 id="tvUsername" class="text-2xl font-extrabold text-gray-900 mt-3">Rahul</h2>
                    <span id="tvBranch" class="inline-block bg-purple-100 text-purple-700 text-xs font-bold px-3 py-1 rounded-full mt-1.5">BTech</span>

                    <div class="flex items-center justify-center mt-6 space-x-6">
                        <div class="text-center px-4">
                            <p class="text-[10px] uppercase font-bold text-gray-400 tracking-wider mb-1">Global Rank</p>
                            <p id="tvRank" class="text-2xl font-extrabold text-gray-900">#14</p>
                        </div>
                        <div class="w-px h-10 bg-gray-200"></div>
                        <div class="text-center px-4">
                            <p class="text-[10px] uppercase font-bold text-gray-400 tracking-wider mb-1">Total Coins</p>
                            <div class="flex items-center justify-center space-x-1 text-blue-600">
                                <span class="iconify" data-icon="mdi:coins" data-width="20"></span>
                                <p id="tvCoins" class="text-2xl font-extrabold tracking-tight">2,450</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- History Section -->
            <div>
                <h3 class="text-sm font-bold text-gray-500 uppercase tracking-widest mb-4 ml-1">Prediction History</h3>

                <div id="emptyHistory" class="hidden flex flex-col items-center justify-center py-10 bg-white rounded-2xl border border-gray-100 border-dashed text-center">
                    <span class="iconify text-gray-300 mb-3" data-icon="mdi:history" data-width="48" data-height="48"></span>
                    <p class="text-sm text-gray-500">No predictions made yet.</p>
                </div>

                <div id="historyList" class="space-y-3">
                    <!-- Populated via JS -->
                </div>
            </div>

        </div>

    </main>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const container = document.getElementById('profileContent');
            const list = document.getElementById('historyList');
            const loadingState = document.getElementById('loadingState');
            const emptyHistory = document.getElementById('emptyHistory');
            const errorState = document.getElementById('errorState');

            document.getElementById('btnBack').addEventListener('click', () => {
                window.history.back();
            });
            document.getElementById('btnRetry').addEventListener('click', loadProfile);

            document.getElementById('btnLogout').addEventListener('click', () => {
                if (confirm('Are you sure you want to logout?')) {
                    // Because we use HttpOnly cookies, we technically need an API endpoint to clear them securely,
                    // but for this phase, deleting localStorage and redirecting to login simulates it until the cookie expires.
                    // (Real production needs a /logout.php to unset the cookie header).
                    localStorage.clear();
                    window.location.href = 'login.html';
                }
            });

            async function loadProfile() {
                loadingState.classList.remove('hidden');
                errorState.classList.add('hidden');
                container.classList.add('hidden');

                try {
                    const response = await Api.get('/Api/Users/history.php');
                    renderProfile(response);
                } catch (error) {
                    loadingState.classList.add('hidden');
                    errorState.classList.remove('hidden');
                    document.getElementById('errorText').textContent = error;
                }
            }

            function renderProfile(data) {
                loadingState.classList.add('hidden');
                container.classList.remove('hidden');

                document.getElementById('tvUsername').textContent = data.profile.username;
                document.getElementById('tvBranch').textContent = data.profile.branch;
                document.getElementById('tvRank').textContent = `#${data.profile.global_rank}`;
                document.getElementById('tvCoins').textContent = data.profile.total_coins.toLocaleString();

                list.innerHTML = '';

                if (data.history.length === 0) {
                    emptyHistory.classList.remove('hidden');
                    return;
                }

                emptyHistory.classList.add('hidden');

                data.history.forEach(item => {

                    let statusClass = "bg-gray-100 text-gray-600";
                    let outcomeIcon = "mdi:clock-outline";

                    if (item.status === 'won') {
                        statusClass = "bg-green-100 text-green-700";
                        outcomeIcon = "mdi:check-circle";
                    } else if (item.status === 'lost') {
                        statusClass = "bg-red-100 text-red-700";
                        outcomeIcon = "mdi:close-circle";
                    }

                    const card = document.createElement('div');
                    card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col";

                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-bold text-gray-500 uppercase tracking-wide truncate pr-2">${item.sport_name}: ${item.match_name}</span>
                            <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded ${statusClass} flex items-center space-x-1">
                                <span class="iconify" data-icon="${outcomeIcon}" data-width="12"></span>
                                <span>${item.status}</span>
                            </span>
                        </div>
                        <h4 class="text-sm font-bold text-gray-900 leading-snug mb-3">${item.question_text}</h4>

                        <div class="flex flex-wrap gap-2 text-xs font-medium">
                            <div class="bg-gray-50 border border-gray-200 px-2.5 py-1.5 rounded-lg text-gray-700">
                                Pick: <span class="font-bold">${item.selected_answer || "Unknown"}</span>
                            </div>
                            <div class="bg-purple-50 border border-purple-100 px-2.5 py-1.5 rounded-lg text-purple-700">
                                Multiplier: <span class="font-bold">${item.points_multiplier}x</span>
                            </div>
                            ${item.correct_answer ? `
                            <div class="bg-blue-50 border border-blue-100 px-2.5 py-1.5 rounded-lg text-blue-700">
                                Result: <span class="font-bold">${item.correct_answer}</span>
                            </div>` : ''}
                        </div>
                    `;

                    list.appendChild(card);
                });
            }

            // Init
            loadProfile();
        });
    </script>
</body>
</html>
