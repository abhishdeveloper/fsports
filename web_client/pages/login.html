<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports Meet - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/app.css">
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen px-6 font-sans">

    <div class="w-full max-w-sm bg-white p-8 rounded-2xl shadow-lg relative">
        <h1 class="text-3xl font-extrabold text-gray-900 text-center mb-2">Welcome Back</h1>
        <p class="text-sm text-gray-500 text-center mb-8">Enter your details to access the Campus Lobby.</p>

        <!-- Error State -->
        <div id="errorBox" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm font-semibold rounded-lg text-center"></div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all placeholder-gray-400"
                    placeholder="student@college.edu">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all placeholder-gray-400"
                    placeholder="••••••••">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-all active:scale-95 flex justify-center items-center">
                <span>Login</span>
                <svg id="loadingSpinner" class="hidden animate-spin ml-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

        <p class="text-sm text-gray-500 text-center mt-6">Don't have an account? <a href="#" class="text-blue-600 font-bold hover:underline">Register</a></p>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('loadingSpinner');
            const errorBox = document.getElementById('errorBox');

            // UI State loading
            btn.disabled = true;
            btn.classList.add('opacity-75');
            spinner.classList.remove('hidden');
            errorBox.classList.add('hidden');

            const payload = {
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                // Post to PHP endpoint. HttpOnly cookies handle token storage automatically!
                const response = await Api.post('/Api/Auth/login.php', payload);

                // Store the role locally to trigger Admin FAB in Lobby
                if (response.role) {
                    localStorage.setItem('user_role', response.role);
                }

                // Route to Lobby
                window.location.href = 'lobby.html';

            } catch (errorMsg) {
                // UI State error
                btn.disabled = false;
                btn.classList.remove('opacity-75');
                spinner.classList.add('hidden');

                errorBox.textContent = errorMsg;
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
