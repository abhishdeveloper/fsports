<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Create Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/app.css">
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</head>
<body class="bg-gray-50 flex flex-col h-screen font-sans">

    <header class="bg-purple-700 border-b border-purple-800 sticky top-0 z-30 shadow-sm flex items-center px-4 py-4">
        <button onclick="window.history.back()" class="text-white hover:text-purple-200 transition-colors p-2 -ml-2 rounded-full">
            <span class="iconify" data-icon="mdi:arrow-left" data-width="24" data-height="24"></span>
        </button>
        <h1 class="text-lg font-bold text-white ml-2">Create New Match</h1>
    </header>

    <div class="flex-1 overflow-y-auto px-4 py-6">

        <div id="loadingState" class="flex justify-center items-center mt-10">
            <span class="iconify animate-spin text-purple-600" data-icon="mdi:loading" data-width="48" data-height="48"></span>
        </div>

        <form id="createMatchForm" class="hidden w-full max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-6">

            <div id="errorBox" class="hidden p-3 bg-red-100 text-red-700 text-sm font-semibold rounded-lg text-center"></div>
            <div id="successBox" class="hidden p-3 bg-green-100 text-green-700 text-sm font-semibold rounded-lg text-center"></div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Select Sport</label>
                <div class="relative">
                    <select id="sportSelect" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl appearance-none focus:ring-2 focus:ring-purple-500 focus:outline-none">
                        <option value="" disabled selected>Loading sports...</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                        <span class="iconify" data-icon="mdi:chevron-down" data-width="20"></span>
                    </div>
                </div>
            </div>

            <div class="border-t border-gray-100 pt-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">Select Teams</label>
                <div class="space-y-3">
                    <div class="relative">
                        <select id="teamASelect" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl appearance-none focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="" disabled selected>Team A...</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                            <span class="iconify" data-icon="mdi:chevron-down" data-width="20"></span>
                        </div>
                    </div>

                    <div class="flex justify-center">
                        <span class="text-xs font-bold text-gray-400 italic">VS</span>
                    </div>

                    <div class="relative">
                        <select id="teamBSelect" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl appearance-none focus:ring-2 focus:ring-red-500 focus:outline-none">
                            <option value="" disabled selected>Team B...</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                            <span class="iconify" data-icon="mdi:chevron-down" data-width="20"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="border-t border-gray-100 pt-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">Start Time (UTC)</label>
                <input type="datetime-local" id="startTime" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none text-gray-700">
            </div>

            <button type="submit" id="submitBtn" class="w-full py-4 mt-4 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow-md transition-all active:scale-95 flex justify-center items-center">
                <span>Create Match</span>
                <span id="submitSpinner" class="iconify animate-spin ml-2 hidden" data-icon="mdi:loading" data-width="20" data-height="20"></span>
            </button>

        </form>

    </div>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {

            // Admin Check
            if (localStorage.getItem('user_role') !== 'admin') {
                window.location.href = 'lobby.html';
                return;
            }

            const form = document.getElementById('createMatchForm');
            const loadingState = document.getElementById('loadingState');
            const sportSelect = document.getElementById('sportSelect');
            const teamASelect = document.getElementById('teamASelect');
            const teamBSelect = document.getElementById('teamBSelect');

            // Load Data
            try {
                const [sportsRes, teamsRes] = await Promise.all([
                    Api.get('/Api/Matches/sports.php'),
                    Api.get('/Api/Matches/teams.php')
                ]);

                sportSelect.innerHTML = '<option value="" disabled selected>Select Sport</option>';
                sportsRes.data.forEach(s => {
                    sportSelect.innerHTML += `<option value="${s.id}">${s.sport_name}</option>`;
                });

                teamASelect.innerHTML = '<option value="" disabled selected>Team A...</option>';
                teamBSelect.innerHTML = '<option value="" disabled selected>Team B...</option>';
                teamsRes.data.forEach(t => {
                    const label = t.branch_name ? `${t.team_name} (${t.branch_name})` : t.team_name;
                    const opt = `<option value="${t.id}">${label}</option>`;
                    teamASelect.innerHTML += opt;
                    teamBSelect.innerHTML += opt;
                });

                loadingState.classList.add('hidden');
                form.classList.remove('hidden');

            } catch (error) {
                alert("Failed to load sports/teams. Ensure you are logged in as admin.");
                window.history.back();
            }

            // Submit Form
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const btn = document.getElementById('submitBtn');
                const spinner = document.getElementById('submitSpinner');
                const errorBox = document.getElementById('errorBox');
                const successBox = document.getElementById('successBox');

                btn.disabled = true;
                spinner.classList.remove('hidden');
                errorBox.classList.add('hidden');
                successBox.classList.add('hidden');

                const teamA = parseInt(teamASelect.value);
                const teamB = parseInt(teamBSelect.value);

                if (teamA === teamB) {
                    errorBox.textContent = "Team A and Team B cannot be the same.";
                    errorBox.classList.remove('hidden');
                    btn.disabled = false;
                    spinner.classList.add('hidden');
                    return;
                }

                // Format datetime-local to MySQL format YYYY-MM-DD HH:MM:SS
                const rawTime = document.getElementById('startTime').value;
                const formattedTime = rawTime.replace('T', ' ') + ':00';

                const payload = {
                    sport_id: parseInt(sportSelect.value),
                    team_a_id: teamA,
                    team_b_id: teamB,
                    start_time: formattedTime
                };

                try {
                    const response = await Api.post('/Api/Admin/create_match.php', payload);

                    successBox.textContent = response.message;
                    successBox.classList.remove('hidden');

                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 1500);

                } catch (errorMsg) {
                    errorBox.textContent = errorMsg;
                    errorBox.classList.remove('hidden');
                    btn.disabled = false;
                    spinner.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
