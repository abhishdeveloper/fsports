<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports Meet - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/app.css">
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</head>
<body class="bg-gray-50 flex flex-col h-screen font-sans">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm flex items-center px-4 py-4">
        <button onclick="window.history.back()" class="text-gray-500 hover:text-gray-900 transition-colors p-2 -ml-2 rounded-full">
            <span class="iconify" data-icon="mdi:arrow-left" data-width="24" data-height="24"></span>
        </button>
        <h1 class="text-lg font-bold text-gray-900 ml-2">Create Account</h1>
    </header>

    <div class="flex-1 overflow-y-auto px-6 py-8">
        <div class="w-full max-w-sm mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
            <p class="text-sm text-gray-500 text-center mb-8">Join the campus leaderboard today.</p>

            <div id="errorBox" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm font-semibold rounded-lg text-center"></div>
            <div id="successBox" class="hidden mb-4 p-3 bg-green-100 text-green-700 text-sm font-semibold rounded-lg text-center"></div>

            <form id="registerForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Rahul">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="email" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="student@college.edu">
                </div>

                <div class="flex space-x-4">
                    <div class="w-1/2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Roll Number</label>
                        <input type="text" id="roll_number" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="102A">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Branch</label>
                        <select id="branch" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none appearance-none">
                            <option value="" disabled selected>Select</option>
                            <option value="BTech">BTech</option>
                            <option value="BAMS">BAMS</option>
                            <option value="BCom">BCom</option>
                            <option value="Staff">Staff</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" required minlength="8" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="••••••••">
                    <p class="text-xs text-gray-400 mt-1">Must be at least 8 characters long.</p>
                </div>

                <button type="submit" id="submitBtn" class="w-full py-4 mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-all active:scale-95 flex justify-center items-center">
                    <span>Register</span>
                    <span id="loadingSpinner" class="iconify animate-spin ml-2 hidden" data-icon="mdi:loading" data-width="20" data-height="20"></span>
                </button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('loadingSpinner');
            const errorBox = document.getElementById('errorBox');
            const successBox = document.getElementById('successBox');

            btn.disabled = true;
            btn.classList.add('opacity-75');
            spinner.classList.remove('hidden');
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');

            const payload = {
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                roll_number: document.getElementById('roll_number').value.trim(),
                branch: document.getElementById('branch').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await Api.post('/Api/Auth/register.php', payload);

                successBox.textContent = "Registration successful! Redirecting...";
                successBox.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);

            } catch (errorMsg) {
                btn.disabled = false;
                btn.classList.remove('opacity-75');
                spinner.classList.add('hidden');

                errorBox.textContent = errorMsg;
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
